<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IncidentPilot</title>
<meta name="description" content="An LLM agent that investigates production incidents, checks its own root cause against evidence, and waits for human approval.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/ui/style.css?v=5">
</head>
<body>

<div class="app">
  <aside class="side" aria-label="Scenarios and incidents">
    <a class="brand" href="/">IncidentPilot</a>

    <nav class="side-group scenarios">
      <h2>Run a scenario</h2>
      <ul id="scenarios" class="nav"></ul>
    </nav>

    <nav class="side-group recent">
      <h2>Recent</h2>
      <ul id="incidents" class="nav"><li class="quiet">None yet</li></ul>
    </nav>

    <section class="side-group model">
      <label for="model-select">Model</label>
      <select id="model-select">
        <option value="server" id="server-model">Built-in model</option>
        <option value="own">My own API key</option>
      </select>
      <div id="own-key" class="own-key" hidden>
        <select id="provider" aria-label="Provider">
          <option value="anthropic">Claude (Anthropic)</option>
          <option value="openai">GPT (OpenAI)</option>
          <option value="gemini">Gemini (Google)</option>
        </select>
        <input id="api-key" type="password" placeholder="API key" autocomplete="off" spellcheck="false" aria-label="API key">
        <input id="model-name" placeholder="Model name (optional)" autocomplete="off" spellcheck="false" aria-label="Model name">
        <p class="note">Used only for the runs you start now. It stays in server memory for that run and is never saved or shown. Use a key with a spending limit.</p>
      </div>
      <p id="notice" class="note" hidden></p>
    </section>
  </aside>

  <main id="detail" class="main"></main>
</div>

<script src="/ui/app.js?v=5"></script>
</body>
</html>
